use_default_settings: true

general:
  instance_name: "PiquiWeb"
  base_url: "https://piquiweb.vercel.app/"
  secret_key: "piquiweb_super_secret_key_999"

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0

engines:
  - name: duckduckgo
    engine: duckduckgo
    timeout: 8.0
    disabled: false

  - name: yahoo
    engine: yahoo
    categories: general
    disabled: false
    weight: 3

  - name: startpage
    engine: startpage
    categories: general
    disabled: false
    weight: 3

  - name: ecosia
    engine: ecosia
    categories: general
    disabled: false
    weight: 3

  - name: yandex
    engine: yandex
    categories: general
    disabled: false
    weight: 3

  - name: privacywall
    engine: privacywall
    categories: general
    disabled: false
    weight: 3
